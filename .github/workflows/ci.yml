name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet build ./src/PzManager.Manager/PzManager.Manager.csproj -c Release
          dotnet build ./src/PzManager.Client.Cli/PzManager.Client.Cli.csproj -c Release
          dotnet build ./godot/PzManager.GodotClient.csproj -c Release

      - name: Test
        run: dotnet test ./tests/PzManager.Domain.Tests/PzManager.Domain.Tests.csproj -c Release

      - name: Test (Application)
        run: dotnet test ./tests/PzManager.Application.Tests/PzManager.Application.Tests.csproj -c Release

      - name: Test (Client)
        run: dotnet test ./tests/PzManager.Client.Tests/PzManager.Client.Tests.csproj -c Release
